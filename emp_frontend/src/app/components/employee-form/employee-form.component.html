<div class="col-12">
  <div class="card border-top-0">
    <div class="card-header bg-info text-white text-center border-0">
      New Employee
    </div>
    <div class="card-body p-2">
      <form #form="ngForm">
        <!-- OCR Component -->
        <div class="col-12 mb-3">
          <app-ocr (ocrResult)="onOCRExtracted($event)"></app-ocr>
        </div>

        <!-- Employee Form -->
        <div class="row g-2">
          <div class="col-12">
            <label class="form-label mb-1" for="personName">Name</label>
            <input
              type="text"
              [(ngModel)]="employeeObj.name"
              name="name"
              id="personName"
              class="form-control form-control-sm"
              required
              autocomplete="name"
            />
          </div>
          <div class="col-12">
            <label class="form-label mb-1" for="emailId">Email</label>
            <input
              type="email"
              [(ngModel)]="employeeObj.email"
              name="email"
              id="emailId"
              class="form-control form-control-sm"
              autocomplete="email"
            />
          </div>
          <div class="col-12">
            <label class="form-label mb-1" for="phoneNo">Phone</label>
            <input
              type="tel"
              [(ngModel)]="employeeObj.phone"
              name="phone"
              id="phoneNo"
              class="form-control form-control-sm"
              autocomplete="tel"
            />
          </div>
          <div class="col-12">
            <label class="form-label mb-1" for="addresses">Address</label>
            <input
              type="text"
              [(ngModel)]="employeeObj.address"
              name="address"
              id="addresses"
              class="form-control form-control-sm"
              autocomplete="street-address"
            />
          </div>
        </div>
        <div class="row mt-3 g-2">
          <div class="col-6">
            <button class="btn btn-secondary btn-sm w-100" (click)="onReset()">Reset</button>
          </div>
          <div class="col-6">
            <button
              class="btn btn-success btn-sm w-100"
              [disabled]="!form.valid"
              (click)="onSave()"
            >
              Save
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
