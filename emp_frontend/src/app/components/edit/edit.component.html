<div class="container-fluid  p-0 mt-4">
    <div class="row g-0 border-0 ">
      <!-- Employee List Card - Wider Column -->
      <div class="col-9 p-2 ">
        <div class="card h-100 p-0 border-0">
          <div class="card-header bg-info text-white text-center border-0">
            Employee List
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-bordered table-sm mb-0" style="width: 100%; table-layout: fixed;">
                <thead class="text-center">
                  <tr>
                    <th style="width: 5%">Id</th>
                    <th style="width: 20%">Name</th>
                    <th style="width: 25%">Email Id</th>
                    <th style="width: 20%">Phone</th>
                    <th style="width: 25%">Address</th>
                    <th style="width: 16%">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  @for (item of employeeList; track $index) {
                  <tr>
                    <td>{{$index+1}}</td>
                    <td>{{item.name | uppercase}}</td>
                    <td>{{item.email}}</td>
                    <td>{{item.phone}}</td>
                    <td>{{item.address}}</td>
                    <td class="text-center">
                      <button class="btn btn-primary btn-sm me-1" (click)="onEdit(item)">Edit</button>
                      <button class="btn btn-danger btn-sm" (click)="onDelete(item.id)">Delete</button>
                    </td>
                  </tr>
                  }
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
  
      <!-- Employee Form Component -->
      <div class="col-3 mt-2 ps-4">
        <app-employee-form
          [employeeData]="selectedEmployee"
          (saveEmployee)="onSaveEmployee($event)"
          (resetForm)="onReset()">
        </app-employee-form>
      </div>
    </div>
  </div>
