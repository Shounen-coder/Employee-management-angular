<div>
    <!-- File Upload -->
    <div class="mb-3">
      <label for="uploadImage" class="form-label">Upload Image</label>
      <input
        type="file"
        #fileInput
        id="uploadImage"
        class="form-control"
        (change)="onFileSelected($event)"
        accept="image/*"
      />
    </div>
  
    <!-- Camera Capture -->
    <div *ngIf="isUsingCamera" class="mb-3">
      <video #videoElement class="w-100" autoplay></video>
      <canvas #canvasElement class="d-none"></canvas>
      <button class="btn btn-primary btn-sm mt-2" (click)="captureImage()">Capture</button>
      <button class="btn btn-danger btn-sm mt-2" (click)="closeCamera()">Close Camera</button>
    </div>
  
    <!-- Open Camera Button -->
    <div *ngIf="!isUsingCamera" class="mb-3">
      <button class="btn btn-warning btn-sm w-100" (click)="openCamera()">Use Camera</button>
    </div>
  
    <!-- Processing Indicator -->
    <div *ngIf="isProcessing" class="text-center mt-3">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Processing...</span>
      </div>
      <p>Processing image... Please wait.</p>
    </div>
  </div>
