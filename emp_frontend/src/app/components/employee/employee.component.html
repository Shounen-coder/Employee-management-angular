<div class="row pt-2">
    <div class="col-12 text-center border-bottom-0">
        <div class="rounded-top  h-50 bg-info mt-5 pt-2">
            <div class="text-white">
                Employee List
            </div>
        </div>
    </div>
</div>
<div class="row pt-2">
    <div class="col-12">
        <div class="row">
            <div class="col-12">
                <table class="table table-bordered text-center">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email Id</th>
                            <th>Phone</th>
                            <th>Address</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of employeeList">
                            
                            <td>{{item.name}}</td>
                            <td>{{item.email}}</td>
                            <td>{{item.phone}}</td>
                            <td>{{item.address}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
